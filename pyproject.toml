[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "bql-lora"
version = "0.1.0"
description = "Training data generator for fine-tuning LLMs on the Beancount Query Language (beanquery, Beancount v3)"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "beancount >= 3.0",
    "beanquery @ git+https://github.com/beancount/beanquery.git",
]

[dependency-groups]
dev = [
    "pytest",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# explicit instead of the ruff defaults, which change between versions
select = ["E4", "E7", "E9", "F", "B", "I", "S113", "UP"]
# single-letter names like `l` are used for loop variables throughout
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
